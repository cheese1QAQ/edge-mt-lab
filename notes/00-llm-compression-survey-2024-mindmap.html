    }

      node._parent = parent;
      node._depth = depth;
      nodeMap.set(node.id, node);
      if (node.children) node.children.forEach(c => indexTree(c, node, depth + 1));

      5: "var(--chart-5)",
      6: "var(--chart-6)"
    };

    const NODE_W = 248;
    const NODE_H = 56;
    const H_GAP = 58;
    const V_GAP = 16;

    function getVisibleChildren(node) {
      if (!node.children || node.children.length === 0 || collapsedIds.has(node.id)) return [];
      return node.children;
    }

    function computeSubtreeHeight(node) {
      const ch = getVisibleChildren(node);
      if (ch.length === 0) {
        node._subH = NODE_H;
        return NODE_H;
      }
      let total = 0;
      ch.forEach((c, idx) => {
        total += computeSubtreeHeight(c);
        if (idx > 0) total += V_GAP;
      });
      node._subH = Math.max(NODE_H, total);
      return node._subH;
    }

      const ch = getVisibleChildren(node);

      if (ch.length === 0) {

        return;

      let curY = yTop;
      ch.forEach(c => {
        assignCoords(c, x + NODE_W + H_GAP, curY);
        curY += c._subH + V_GAP;
      });
      node._y = (ch[0]._y + ch[ch.length - 1]._y) / 2;

          stroke: isSelected ? "var(--primary)" : branchColor,
          "stroke-width": isSelected ? "2.5" : "1.4"
        }));

        g.appendChild(svgEl("rect", {
          x: 0, y: 0, width: 6, height: NODE_H, rx: 3, fill: branchColor
        }));

        const titlePrefix = node.blindspot ? (isMastered ? "✓ " : "⚡ ") : "";
        const titleEl = svgEl("text", {
          x: 15, y: 23, fill: "var(--foreground)", "font-size": "13", "font-weight": "600"
        });
        titleEl.textContent = truncateText(titlePrefix + node.title, 20);
        g.appendChild(titleEl);

        const subEl = svgEl("text", {
          x: 15, y: 42, fill: "var(--muted-foreground)", "font-size": "12"
        });
        subEl.textContent = truncateText(node.subtitle, 24);
        g.appendChild(subEl);

        if (node.blindspot) {
          g.appendChild(svgEl("circle", {
            cx: NODE_W - 14, cy: 14, r: 5,
            fill: isMastered ? "var(--success)" : "var(--warning)"
          }));
        }

        g.addEventListener("click", (e) => {
          e.stopPropagation();
          selectNode(node.id);
        });

        if (hasChildren) {
          const toggleG = svgEl("g", {
            transform: `translate(${NODE_W}, ${NODE_H / 2})`,
            style: "cursor: pointer;"
          });
          toggleG.appendChild(svgEl("circle", {
            cx: 0, cy: 0, r: 10, fill: "var(--card)", stroke: branchColor, "stroke-width": "1.5"
          }));
          const label = svgEl("text", {
            x: 0, y: 4, "text-anchor": "middle", fill: "var(--foreground)", "font-size": "13", "font-weight": "700"
          });
          label.textContent = isCollapsed ? "+" : "−";
          toggleG.appendChild(label);
          toggleG.addEventListener("click", (e) => {
            e.stopPropagation();
            if (collapsedIds.has(node.id)) collapsedIds.delete(node.id);
            else collapsedIds.add(node.id);
            renderMap();
          });
          g.appendChild(toggleG);
        }

        nodesLayer.appendChild(g);
      });
    }

    function fitToScreen() {
      computeSubtreeHeight(TREE_DATA);
      assignCoords(TREE_DATA, 0, 0);
      const { nodes } = collectVisible(TREE_DATA);
      if (!nodes.length) return;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      nodes.forEach(n => {
        minX = Math.min(minX, n._x);
        maxX = Math.max(maxX, n._x + NODE_W + 14);
        minY = Math.min(minY, n._y);
        maxY = Math.max(maxY, n._y + NODE_H);
      });
      const rect = svg.getBoundingClientRect();
      const pad = 44;
      const contentW = Math.max(1, maxX - minX);
      const contentH = Math.max(1, maxY - minY);
      transform.scale = Math.max(0.42, Math.min(1.05, Math.min((rect.width - pad * 2) / contentW, (rect.height - pad * 2) / contentH)));
      transform.x = (rect.width - contentW * transform.scale) / 2 - minX * transform.scale;
      transform.y = (rect.height - contentH * transform.scale) / 2 - minY * transform.scale;
      applyTransform();
    }

    function centerOnNode(id) {
      const node = nodeMap.get(id);
      if (!node) return;
      let cur = node._parent;
      let changed = false;
      while (cur) {
        if (collapsedIds.has(cur.id)) { collapsedIds.delete(cur.id); changed = true; }
        cur = cur._parent;
      }
      if (changed) renderMap();
      const rect = svg.getBoundingClientRect();
      transform.scale = Math.max(transform.scale, 0.88);
      transform.x = rect.width / 2 - (node._x + NODE_W / 2) * transform.scale;
      transform.y = rect.height / 2 - (node._y + NODE_H / 2) * transform.scale;
      applyTransform();
    }

    // Drawer Logic
    const panelDetail = document.getElementById("panel-detail");
    const panelChecklist = document.getElementById("panel-checklist");
    const checklistItems = document.getElementById("checklist-items");
    const blindspotCounter = document.getElementById("blindspot-counter");
    const tabDetail = document.getElementById("tab-detail");
    const tabChecklist = document.getElementById("tab-checklist");

    function switchTab(tab) {
      if (tab === "detail") {
        panelDetail.classList.remove("hidden");
        panelChecklist.classList.add("hidden");
        tabDetail.classList.add("active");
        tabChecklist.classList.remove("active");
      } else {
        panelChecklist.classList.remove("hidden");
        panelDetail.classList.add("hidden");
        tabChecklist.classList.add("active");
        tabDetail.classList.remove("active");
      }
    }

    tabDetail.addEventListener("click", () => switchTab("detail"));
    tabChecklist.addEventListener("click", () => switchTab("checklist"));

    function updateBlindspotCounter() {
      blindspotCounter.textContent = `${masteredIds.size} / ${blindspotNodes.length}`;
    }

    function renderChecklist() {
      checklistItems.innerHTML = "";
      blindspotNodes.forEach(node => {
        const done = masteredIds.has(node.id);
        const item = document.createElement("div");
        item.className = "check-item";
        item.innerHTML = `
          <input type="checkbox" ${done ? "checked" : ""} />
          <div style="min-width:0; flex:1;">
            <div class="check-title ${done ? "done" : ""}">${node.blindspotOrder}. ${node.title}</div>
            <div class="check-sub">${node.subtitle}</div>
          </div>
        `;
        item.querySelector("input").addEventListener("click", (e) => {
          e.stopPropagation();
          toggleMastered(node.id);
        });
        item.addEventListener("click", () => {
          selectNode(node.id, true);
          switchTab("detail");
        });
        checklistItems.appendChild(item);
      });
    }

    function toggleMastered(id) {
      if (masteredIds.has(id)) masteredIds.delete(id);
      else masteredIds.add(id);
      saveMastered();
      updateBlindspotCounter();
      renderChecklist();
      renderDetail(selectedId);
      renderMap();
    }

    function renderDetail(id) {
      const node = nodeMap.get(id);
      if (!node) return;
      const branchColor = BRANCH_COLORS[node.branch] || "var(--primary)";
      const isMastered = masteredIds.has(node.id);

      const connectedHtml = (node.connects || [])
        .map(cid => nodeMap.get(cid))
        .filter(Boolean)
        .map(cn => `
          <button data-jump="${cn.id}" class="jump-btn">
            <span>${cn.blindspot ? "⚡ " : "→ "}${cn.title}</span>
            <span class="go">跳转</span>
          </button>
        `).join("");

      panelDetail.innerHTML = `
        <div class="detail-header">
          <div class="detail-header-row">
            <span class="status-chip">
              <span class="dot" style="background: ${branchColor}; width: 8px; height: 8px;"></span>
              ${node.status}
            </span>
            ${node.blindspot ? `
              <button id="btn-toggle-mastered" class="master-btn ${isMastered ? "done" : ""}">
                ${isMastered ? "✓ 已掌握此盲点" : "标记为已懂"}
              </button>
            ` : ""}
          </div>
          <h2 class="detail-title">${node.title}</h2>
          <p class="detail-sub">${node.subtitle}</p>
        </div>

        <div class="info-card">
          <div class="info-card-title">💡 一句话大白话</div>
          <p>${node.plain}</p>
        </div>

        <div class="info-card muted">
          <div class="info-card-title">🧩 生活化类比</div>
          <p>${node.analogy}</p>
        </div>

        <div class="info-card muted">
          <div class="info-card-title">🎯 它解决什么问题 / 为什么重要？</div>
          <p>${node.solves}</p>
        </div>

        ${connectedHtml ? `
          <div class="connect-label">🔗 顺藤摸瓜 · 关联知识节点</div>
          <div>${connectedHtml}</div>
        ` : ""}
      `;

      const masterBtn = document.getElementById("btn-toggle-mastered");
      if (masterBtn) masterBtn.addEventListener("click", () => toggleMastered(node.id));

      panelDetail.querySelectorAll("[data-jump]").forEach(btn => {
        btn.addEventListener("click", () => selectNode(btn.getAttribute("data-jump"), true));
      });
    }

    function selectNode(id, shouldCenter = false) {
      selectedId = id;
      renderDetail(id);
      renderMap();
      if (shouldCenter) centerOnNode(id);
    }

    // Pan & Zoom
    let isPanning = false;
    let panStart = { x: 0, y: 0 };

    svg.addEventListener("mousedown", (e) => {
      if (e.target.closest(".node-group")) return;
      isPanning = true;
      panStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
    });

    window.addEventListener("mousemove", (e) => {
      if (!isPanning) return;
      transform.x = e.clientX - panStart.x;
      transform.y = e.clientY - panStart.y;
      applyTransform();
    });

    window.addEventListener("mouseup", () => { isPanning = false; });

    svg.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = svg.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.1 : 0.91;
      const nextScale = Math.max(0.35, Math.min(1.8, transform.scale * factor));
      transform.x = mx - (mx - transform.x) * (nextScale / transform.scale);
      transform.y = my - (my - transform.y) * (nextScale / transform.scale);
      transform.scale = nextScale;
      applyTransform();
    }, { passive: false });

    document.getElementById("btn-expand-all").addEventListener("click", () => {
      collapsedIds.clear();
      renderMap();
      fitToScreen();
    });

    document.getElementById("btn-collapse-core").addEventListener("click", () => {
      collapsedIds.clear();
      nodeMap.forEach(n => {
        if (n._depth >= 1 && n.children && n.children.length > 0) collapsedIds.add(n.id);
      });
      renderMap();
      fitToScreen();
    });

    document.getElementById("btn-zoom-in").addEventListener("click", () => {
      transform.scale = Math.min(1.8, transform.scale * 1.15);
      applyTransform();
    });

    document.getElementById("btn-zoom-out").addEventListener("click", () => {
      transform.scale = Math.max(0.35, transform.scale * 0.87);
      applyTransform();
    });

    document.getElementById("btn-fit").addEventListener("click", fitToScreen);

    document.querySelectorAll("#filter-bar .pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeMode = btn.getAttribute("data-mode");
        document.querySelectorAll("#filter-bar .pill-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        if (activeMode === "blindspot") {
          collapsedIds.clear();
          switchTab("checklist");
        }
        renderMap();
      });
    });

    initTheme();
    updateBlindspotCounter();
    renderChecklist();
    renderDetail(selectedId);
    renderMap();
    requestAnimationFrame(fitToScreen);
    window.addEventListener("resize", fitToScreen);
  </script>
</body>
</html>
